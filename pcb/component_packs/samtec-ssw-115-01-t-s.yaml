validation:
  known_gaps:
  - The ESP32 dev board is socketed here, not soldered, so it is absent from the board
    netlist. No firmware-facing pin capability can be validated from this board source;
    GPIO5 correctness is a firmware constant, checked in pcb_build_spec.md instead.
policy:
  no_fake_assets: true
  notes: ESP32 dev-board socket (H1/H2). Hand-soldered, left unpopulated in the JLCPCB
    assembly BOM. 1.0 mm drill / 2.0 mm pad (v1.2; 0.5 mm annular ring for hand soldering,
    0.54 mm between neighbours). Rows sit 26.0 mm apart, centre to
    centre - measured on the actual dev board. Solder both with the ESP32 plugged in
    so they self-align to the real pin positions.
