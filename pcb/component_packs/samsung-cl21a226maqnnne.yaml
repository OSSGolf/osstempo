validation:
  known_gaps:
  - X5R dielectric derates with DC bias. Nominal 22 uF at 5 V bias is roughly 15-18 uF
    effective, so C1+C2 deliver about 30-36 uF rather than 44 uF. Adequate for the
    comet animation at BRIGHTNESS_DEFAULT 40; bright or full-strip use should inject
    5 V at J2 and rely on the supply's own bulk.
policy:
  no_fake_assets: true
  notes: Bulk decoupling at the WS2812B strip connector. Chosen over an SMD aluminium
    electrolytic because electrolytics are frequently Extended on JLCPCB (~$3 feeder
    fee) while this is a Basic part; it also removes any polarity-reversal risk. The
    25 V rating (rather than 16 V) was picked deliberately to limit DC-bias derating
    on the 5 V rail.
